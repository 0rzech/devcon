[[models]]
name = "mistral-vibe-cli-latest"
provider = "mistral"
alias = "mistral-vibe"
display_name = "m → Vibe CLI"
temperature = 1.0
input_price = 1.5
output_price = 7.5
cached_input_price = 0.15
thinking = "high"
thinking_levels = [
    "off",
    "high"
]
supports_images = true
max_content_length = 262144
auto_compact_threshold = 209715

[experiments]
enable = false
api_host = "https://experiments.mistral.services/"
client_key = "sdk-OE8yJgTXZY6tj"

[session_logging]
session_prefix = "session"
enabled = true
generate_titles = true

[tools.bash]
permission = "ask"
allowlist = [
    "basename",
    "bat",
    "cd",
    "comm",
    "cut",
    "date",
    "diff",
    "dirname",
    "du",
    "echo",
    "fd",
    "file",
    "find",
    "fmt",
    "fold",
    "git diff",
    "git log",
    "git status",
    "grep",
    "head",
    "join",
    "less",
    "ls",
    "md5sum",
    "more",
    "nl",
    "od",
    "paste",
    "pwd",
    "readlink",
    "rg",
    "sha1sum",
    "sha256sum",
    "shasum",
    "sort",
    "stat",
    "sum",
    "tac",
    "tail",
    "tr",
    "tree",
    "uname",
    "uniq",
    "wc",
    "which",
    "whoami",
]
denylist = [
    "cat",
    "gdb",
    "pdb",
    "passwd",
    "nano",
    "vim",
    "vi",
    "emacs",
    "bash -c",
    "bash -i",
    "sh -c",
    "sh -i",
    "zsh -c",
    "zsh -i",
    "fish -c",
    "fish -i",
    "dash -c",
    "dash -i",
    "screen",
    "tmux",
    "git push --force",
]
sensitive_patterns = [
    "sudo",
]
max_output_bytes = 16000
default_timeout = 300
denylist_standalone = [
    "python",
    "python3",
    "ipython",
    "bash",
    "sh",
    "zsh",
    "fish",
    "dash",
    "nohup",
    "vi",
    "vim",
    "emacs",
    "nano",
    "su",
]

[tools.edit]
permission = "ask"
allowlist = []
denylist = []
sensitive_patterns = [
    "**/.env",
    "**/.env.*",
]

[tools.task]
permission = "ask"
allowlist = [
    "explore",
]
denylist = []
sensitive_patterns = []

[tools.web_fetch]
permission = "ask"
allowlist = []
denylist = []
sensitive_patterns = []
default_timeout = 30
max_timeout = 120
max_content_bytes = 120000
