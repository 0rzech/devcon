[tools.web_search]
permission = "ask"
allowlist = []
denylist = []
sensitive_patterns = []
timeout = 120
model = "mistral-vibe-cli-with-tools"

[tools.write_file]
permission = "ask"
allowlist = []
denylist = []
sensitive_patterns = [
    "**/.env",
    "**/.env.*",
]
max_write_bytes = 64000
create_parent_dirs = true

[tools.read_file]
permission = "always"
allowlist = []
denylist = []
sensitive_patterns = [
    "**/.env",
    "**/.env.*",
]
max_read_bytes = 51200
