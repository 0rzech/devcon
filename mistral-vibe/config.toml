active_model = "zai-glm"
allowed_models = [
    "mistral-large-*",
    "mistral-medium-*",
    "zai-*",
]
default_agent = "smart-approve"
bypass_tool_permissions = false
enable_system_trust_store = true
otel_redaction = "strict"
enable_telemetry = false
include_commit_signature = false
include_model_info = true
include_project_context = true
include_prompt_detail = true
autocopy_to_clipboard = true
enable_update_checks = false
enable_auto_update = false
enable_notifications = true
experimental_enable_tab_status = false
file_watcher_for_autocomplete = false
disable_welcome_banner_animation = true
cursor_blink = false
theme = "auto"
voice_mode_enabled = false
narrator_enabled = false

[[providers]]
name = "mistral"
api_base = "https://api.mistral.ai/v1"
api_key_env_var = "MISTRAL_API_KEY"
browser_auth_base_url = "https://console.mistral.ai"
browser_auth_api_base_url = "https://console.mistral.ai/api"
browser_auth_allow_origin_rewrite = false
api_style = "openai"
backend = "mistral"
reasoning_field_name = "reasoning_content"
emits_finish_reason = true
project_id = ""
region = ""

[providers.extra_headers]

[[models]]
name = "zai-glm-5-3"
provider = "mistral"
alias = "zai-glm"
display_name = "m → GLM"
temperature = 1.0
input_price = 1.4
output_price = 4.4
thinking = "high"
thinking_levels = [
    "off",
    "low",
    "medium",
    "high",
    "max"
]
supports_images = false
auto_compact_threshold = 800000

[[models]]
name = "mistral-large-4"
provider = "mistral"
alias = "mistral-large"
display_name = "m → Large"
temperature = 1.0
input_price = 1.36
output_price = 4.18
thinking = "high"
thinking_levels = [
    "high"
]
supports_images = true
auto_compact_threshold = 256000

[[models]]
name = "mistral-medium-latest"
provider = "mistral"
alias = "mistral-medium"
display_name = "m → Medium"
temperature = 1.0
